  <path d="M10 88 H30 V74 H50 V60 H70 V46 H90 V88 Z" fill="#FFFFFF" opacity=".22"/>
  <path d="M10 88 H30 V74 H50 V60 H70 V46 H90" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- persona subiendo un escalón: movilidad -->
  <circle cx="66" cy="13" r="7" fill="#FFFFFF"/>
  <path d="M63 22 L57 38" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <path d="M57 38 L69 33 L74 44 M57 38 L52 48 L56 58 M62 25 L72 31 M62 25 L52 30" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- flecha abajo: bajar peso -->
  <circle cx="24" cy="26" r="15" fill="#2BB673"/>
  <path d="M24 17 V35 M16.5 28 L24 35.5 L31.5 28" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
