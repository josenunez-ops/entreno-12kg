<title>Entreno 12 kg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-column phone app, max 560px, sticky header + fixed bottom tab bar. Accent = blue of a 12 kg competition kettlebell. */
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --ink:#16202A; --muted:#5A6873; --line:#D6DDD8;
  --accent:#2457CF; --accent-ink:#FFFFFF; --accent-soft:#E2EAFB;
  --limb2:#9AA6AE; --prop:#B9C2BC; --good:#1E7A4C; --warn:#B4600B; --bad:#B42318;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1317; --surface:#172027; --ink:#E7ECE9; --muted:#9AA7B0; --line:#2A353D;
  --accent:#6A93F2; --accent-ink:#0B1020; --accent-soft:#1D2A47;
  --limb2:#5C6A73; --prop:#3A4750; --good:#4CC38A; --warn:#E39B4B; --bad:#F07167; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1317; --surface:#172027; --ink:#E7ECE9; --muted:#9AA7B0; --line:#2A353D;
  --accent:#6A93F2; --accent-ink:#0B1020; --accent-soft:#1D2A47;
  --limb2:#5C6A73; --prop:#3A4750; --good:#4CC38A; --warn:#E39B4B; --bad:#F07167; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:30px} h2{font-size:24px} h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.tab-num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.hero .eyebrow{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.hero .chip{background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg)}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink);width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:9px 12px;font-size:15px;width:auto}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.day .d{font-size:12px;color:var(--muted);font-weight:600}
.day .t{font-family:var(--display);font-size:17px;font-weight:700}
.day[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day.sel{background:var(--accent-soft)}
.day .dot{width:6px;height:6px;border-radius:50%;background:transparent}
.day .dot.on{background:var(--good)}
.exlist{display:flex;flex-direction:column}
.exrow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.exrow:first-child{border-top:0}
.thumb{width:64px;height:54px;border-radius:10px;background:var(--bg);display:block}
.exrow .nm{font-weight:600;line-height:1.2}
.exrow .dose{font-family:var(--display);font-size:18px;font-weight:700;white-space:nowrap}
.fig{width:100%;aspect-ratio:240/222;max-width:100%;background:var(--bg);border-radius:12px;display:block}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:24px;height:24px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.note{border-left:3px solid var(--warn);padding:8px 12px;background:color-mix(in srgb,var(--warn) 9%,var(--surface));border-radius:0 10px 10px 0;font-size:15px}
.note.info{border-color:var(--accent);background:var(--accent-soft)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .v{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.stat .l{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--muted);flex:1;min-width:0}
input,select{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td,table.t th{padding:7px 4px;border-top:1px solid var(--line);text-align:left}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:4px 8px}
.phase{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.phase:first-of-type{border-top:0}
.phase .wk{font-family:var(--display);font-weight:700;font-size:18px;color:var(--accent);white-space:nowrap}
.phase.cur .wk::after{content:" ● ahora";font-size:13px;color:var(--good)}
/* player */
.player{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.player .in{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 24px;display:flex;flex-direction:column;gap:12px;min-height:100%}
.player .fig{max-height:40vh;width:auto;margin-inline:auto}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.big{font-family:var(--display);font-size:64px;font-weight:700;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.dose-big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1}
.rest{position:fixed;inset:0;z-index:30;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.rest .big{font-size:110px}
.rest .btn.ghost{color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
details summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details summary::after{content:"+";font-size:20px;color:var(--muted)}
details[open] summary::after{content:"–"}
.chart{width:100%;height:auto;display:block}
.kb-mark{display:inline-flex;align-items:center;gap:6px}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head><body>


<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M9 11 C9 4 21 4 21 11" fill="none" stroke="var(--ink)" stroke-width="3"/><circle cx="15" cy="19" r="9" fill="var(--accent)"/><text x="15" y="22.5" text-anchor="middle" font-family="Barlow Condensed,sans-serif" font-weight="700" font-size="10" fill="var(--accent-ink)">12</text></svg>
      <b>Entreno 12 kg</b>
    </div>
    <div class="seg" role="group" aria-label="Dónde entrenas">
      <button id="m-casa" aria-pressed="true">Casa</button>
      <button id="m-gym" aria-pressed="false">Gimnasio</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<div class="tabs"><nav aria-label="Secciones">
  <button data-tab="hoy" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="7"/><path d="M8 7c0-4 8-4 8 0"/></svg>Hoy</button>
  <button data-tab="ejercicios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Ejercicios</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-tab="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Progreso</button>
  <button data-tab="comida"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M12 12h8"/></svg>Comida</button>
</nav></div>

<div id="player" class="player" hidden></div>
<div id="rest" class="rest" hidden></div>

<script>
/* ============ DATOS: ejercicios ============ */
// Ángulos absolutos en grados: 0 = hacia abajo, 90 = hacia delante (derecha), 180 = arriba, -90 = atrás.
// a:'f' ancla el pie delantero en (x,y); a:'h' ancla la cadera.
const STAND={a:'f',x:118,y:182,T:180,L1:0,S1:0,L2:0,S2:0,A1:0,F1:0,A2:0,F2:0};
const SEAT=[{r:[64,130,80,9]},{r:[60,72,9,66]},{l:[104,139,104,185]}];
const EX={
 c_goblet:{n:'Sentadilla goblet',w:'ambos',eq:'Kettlebell 12 kg (o mancuerna)',m:['Piernas','Glúteos','Core'],
  pose:{eq:'kb',A:{...STAND,x:120,A1:5,F1:160},B:{...STAND,x:120,L1:80,S1:-20,L2:80,S2:-20,T:148,A1:30,F1:170},per:3.4},
  steps:['Pies a la anchura de hombros, puntas algo abiertas. Sujeta la pesa por los cuernos pegada al pecho.','Saca el culo atrás y baja como si te sentaras en una silla, con el pecho alto.','Baja hasta que los muslos queden paralelos al suelo (o hasta donde mantengas la espalda recta).','Empuja el suelo con todo el pie y sube soplando el aire.'],
  err:['Rodillas que se van hacia dentro: empújalas hacia fuera.','Talones que se levantan: el peso va en medio pie y talón.','Redondear la espalda abajo: baja menos.'],
  easy:'Pon una silla detrás y siéntate y levántate de ella (sentadilla a caja). Es la mejor forma de proteger las rodillas al principio.'},
 c_swing:{n:'Swing ruso',w:'casa',eq:'Kettlebell 12 kg',m:['Glúteos','Isquios','Espalda baja','Cardio'],
  pose:{eq:'kb',A:{...STAND,x:115,A1:88,F1:90},B:{...STAND,x:115,L1:35,S1:-12,L2:35,S2:-12,T:118,A1:-10,F1:-25},per:1.6},
  steps:['Pies algo más anchos que los hombros, pesa en el suelo un palmo delante.','Bisagra de cadera: lleva la pesa entre las piernas, por encima de las rodillas, con la espalda plana.','Extiende la cadera de golpe apretando glúteos: la pesa sube sola hasta la altura del pecho. Los brazos solo guían.','Deja caer la pesa y vuelve a cargar la cadera. Es un movimiento de cadera, no de sentadilla ni de hombros.'],
  err:['Levantar la pesa con los brazos.','Doblar mucho las rodillas (se convierte en sentadilla).','Echarse hacia atrás arriba: termina recto, como una tabla.'],
  easy:'Empieza con el peso muerto con kettlebell 2 semanas para aprender la bisagra. Luego haz swings cortos (pesa a la altura de la cadera).'},
 c_pmkb:{n:'Peso muerto con kettlebell',w:'casa',eq:'Kettlebell 12 kg',m:['Glúteos','Isquios','Espalda'],
  pose:{eq:'kb',A:{...STAND,x:118,L1:40,S1:-12,L2:40,S2:-12,T:128},B:{...STAND,x:118},per:3.2},
  steps:['Pesa en el suelo entre los pies.','Lleva la cadera atrás, rodillas un poco flexionadas, espalda recta y mirada al suelo un metro delante.','Agarra el asa con las dos manos, hombros hacia atrás y abajo.','Empuja el suelo y lleva la cadera adelante hasta quedarte de pie. Aprieta glúteos arriba.'],
  err:['Espalda curvada: es el error más peligroso.','Tirar con los brazos.','Hiperextender la espalda arriba.'],
  easy:'Pon la pesa sobre un escalón o dos libros gruesos para recorrer menos distancia.'},
 c_rdl:{n:'Peso muerto rumano con mancuernas',w:'ambos',eq:'2 mancuernas de 12 kg',m:['Isquios','Glúteos','Espalda baja'],
  pose:{eq:'db',A:{...STAND},B:{...STAND,L1:14,S1:-6,L2:14,S2:-6,T:102},per:3.6},
  steps:['De pie, una mancuerna en cada mano delante de los muslos.','Rodillas ligeramente flexionadas y fijas.','Lleva la cadera atrás deslizando las mancuernas pegadas a las piernas hasta media tibia o hasta notar tirantez detrás del muslo.','Sube empujando la cadera adelante. Baja en 3 segundos, sube en 1.'],
  err:['Doblar las rodillas cada vez más (se vuelve peso muerto normal).','Separar las pesas de las piernas.','Redondear la espalda para llegar más abajo.'],
  easy:'Hazlo con una sola mancuerna sujeta con las dos manos.'},
 c_remo:{n:'Remo inclinado con dos mancuernas',w:'ambos',eq:'2 mancuernas de 12 kg',m:['Espalda','Bíceps','Hombro posterior'],
  pose:{eq:'db',A:{...STAND,L1:20,S1:-10,L2:20,S2:-10,T:112},B:{...STAND,L1:20,S1:-10,L2:20,S2:-10,T:112,A1:-70,F1:-5,A2:-70,F2:-5},per:2.8},
  steps:['Inclínate desde la cadera unos 45°, espalda plana, rodillas suaves.','Brazos estirados, mancuernas bajo los hombros.','Lleva los codos hacia atrás y arriba, rozando el cuerpo, hasta que las pesas toquen la cintura.','Junta los omóplatos un segundo y baja controlando.'],
  err:['Tirar con impulso del tronco.','Encoger los hombros hacia las orejas.','Codos muy abiertos.'],
  easy:'Es la progresión del remo a un brazo apoyado. Si notas la lumbar, vuelve a la versión apoyada.'},
 c_remo1:{n:'Remo a un brazo apoyado',w:'ambos',eq:'1 mancuerna de 12 kg + silla',m:['Espalda','Bíceps','Postura'],
  pose:{eq:'db1',A:{...STAND,L1:20,S1:-10,L2:20,S2:-10,T:100,A1:0,F1:0,A2:30,F2:30},B:{...STAND,L1:20,S1:-10,L2:20,S2:-10,T:100,A1:-70,F1:-5,A2:30,F2:30},
   props:[{r:[168,141,48,6]},{l:[174,147,174,185]},{l:[210,147,210,185]}],per:2.8},
  steps:['Apoya una mano (o mano y rodilla) en una silla firme. Espalda plana, casi horizontal.','La mancuerna cuelga bajo el hombro con el brazo estirado.','Tira del codo hacia atrás y arriba, hacia el bolsillo, hasta que la pesa llegue a la cintura.','Baja en 2-3 segundos. Haz todas las repeticiones y cambia de lado.'],
  err:['Girar el tronco para subir la pesa.','Encoger el hombro hacia la oreja.','Redondear la espalda.'],
  easy:'Es la versión más segura para la espalda. Progresión: remo inclinado con dos mancuernas sin apoyo.'},
 c_presssuelo:{n:'Press de pecho en el suelo',w:'casa',eq:'2 mancuernas de 12 kg',m:['Pecho','Tríceps','Hombro'],
  pose:{eq:'db',A:{a:'h',x:150,y:176,T:-88,L1:140,S1:15,L2:140,S2:15,A1:180,F1:180,A2:180,F2:180},B:{a:'h',x:150,y:176,T:-88,L1:140,S1:15,L2:140,S2:15,A1:95,F1:180,A2:95,F2:180},per:3},
  steps:['Túmbate boca arriba con las rodillas dobladas y los pies apoyados.','Mancuernas sobre el pecho, brazos estirados, muñecas firmes.','Baja hasta que la parte de atrás del brazo toque el suelo, codos a unos 45° del cuerpo.','Empuja hacia arriba soplando. El suelo limita el recorrido y protege el hombro.'],
  err:['Dejar caer los codos de golpe contra el suelo.','Codos abiertos en cruz a 90° (carga el hombro).','Arquear la zona lumbar.'],
  easy:'Hazlo alternando brazos o con una sola mancuerna sujeta con ambas manos.'},
 c_militar:{n:'Press de hombros con mancuernas',w:'ambos',eq:'2 mancuernas de 12 kg',m:['Hombros','Tríceps','Core'],
  pose:{eq:'db',A:{a:'h',x:95,y:140,T:180,L1:90,S1:0,L2:90,S2:0,A1:25,F1:172,A2:25,F2:172},B:{a:'h',x:95,y:140,T:180,L1:90,S1:0,L2:90,S2:0,A1:178,F1:180,A2:178,F2:180},props:[{r:[62,142,70,8]},{r:[80,58,9,86]},{l:[95,150,95,185]}],per:2.8},
  steps:['Sentado en una silla con respaldo, mancuernas a la altura de los hombros, palmas mirándose. Las primeras semanas, alterna brazos.','Aprieta glúteos y abdomen para no arquear la espalda.','Empuja las pesas hacia arriba hasta estirar los brazos, cerca de las orejas.','Baja en 2-3 segundos hasta los hombros.'],
  err:['Arquear la zona lumbar para subir.','Bloquear los codos de golpe.','Sacar la cabeza hacia delante.'],
  easy:'Semana 1: una sola mancuerna sujeta con las dos manos. Después, alternando brazos. De pie solo cuando domines 3×10 sentado.'},
 c_zancada:{n:'Zancada hacia atrás',w:'casa',eq:'2 mancuernas de 12 kg (opcional)',m:['Glúteos','Cuádriceps','Equilibrio'],
  pose:{eq:'db',A:{...STAND,x:150},B:{...STAND,x:150,L1:80,S1:-5,L2:-20,S2:-80},per:3.2},
  steps:['De pie con las pesas a los lados (o sin peso al principio).','Da un paso largo hacia atrás y baja hasta que la rodilla de atrás casi toque el suelo.','El tronco recto y la rodilla delantera encima del tobillo.','Empuja con el talón delantero para volver. Alterna piernas.'],

 return h+`</div>`}

function vPlan(){const pi=phaseIdx();
 return `<div class="stack"><h1>Tu plan</h1>

 ${[1,2,3,4,5,6,0].map(i=>{const w=workoutFor(i);return `<tr><td><b>${WEEK[i].d}</b></td><td>${w?esc(w.t):'Descanso'}</td><td class="tab-num">${w?'≈'+estMin(w,pi)+' min':'–'}</td></tr>`}).join('')}</table>
 <p class="small muted" style="margin-top:8px">3 días de fuerza para mantener músculo mientras pierdes grasa, 2 de cardio en zona 2 y una caminata larga opcional. Ninguna sesión pasa de 60 minutos.</p></div>
 <div class="card"><h3>Fases</h3><p class="small muted">Vas por la semana ${weekNo()}.</p>${PHASES.map((p,i)=>`<div class="phase${i===pi?' cur':''}"><span class="wk">Sem ${p.from}${p.to<999?'–'+p.to:'+'}</span><span><b>${p.n}</b><br><span class="small">${p.d}</span></span></div>`).join('')}</div>
 <div class="card stack"><h3>Por qué así (marcar, no volumen)</h3><ul class="plain">
  <li><b>La definición sale de perder grasa</b>, y eso lo decide la alimentación (pestaña Comida). Comiendo en déficit no se gana volumen: el entreno conserva el músculo y lo deja marcado al bajar la grasa.</li>
  <li><b>Más tirón que empuje</b>: hay remo en todas las sesiones de fuerza para mejorar la postura y proteger los hombros. Una goma elástica (15–25 €) permite añadir jalones en casa.</li>
  <li><b>Repeticiones de 10–15</b> con descansos cortos: buen estímulo para tonificar con gasto calórico alto, sin buscar hipertrofia máxima.</li>

  <li><b>Con 12 kg fijos</b> progresas con más repeticiones, bajadas lentas, menos descanso y ejercicios a una pierna o un brazo. Cuando 12 kg se queden cortos en goblet y swing, el siguiente paso lógico es una kettlebell de 16 kg.</li></ul></div>
 <div class="card stack"><h3>Ajustes</h3>

  <div class="row wrap"><label class="f">Altura (cm)<input type="number" inputmode="numeric" id="s-h" value="${st.height}"></label><label class="f">Edad<input type="number" inputmode="numeric" id="s-age" value="${st.age}"></label><label class="f">Objetivo (kg)<input type="number" inputmode="decimal" id="s-goal" value="${st.goal}"></label></div>
  <label class="row small" style="font-weight:600"><input type="checkbox" id="s-htn" style="width:22px;height:22px;flex:none" ${st.htn?'checked':''}> Hipertensión (activa la comprobación previa y el registro de tensión)</label>
  <label class="f">Sexo<select id="s-sex"><option value="h"${st.sex==='h'?' selected':''}>Hombre</option><option value="m"${st.sex==='m'?' selected':''}>Mujer</option></select></label>
  <p class="small muted">Tus datos se guardan solo en este móvil. Haz una copia de seguridad de vez en cuando (por ejemplo, pégala en una nota).</p>
  <div class="row wrap"><button class="btn sm ghost" id="b-exp">Copiar copia de seguridad</button><button class="btn sm ghost" id="b-reset">Empezar de cero</button></div>
  <p class="small" id="b-msg" aria-live="polite"></p><textarea id="b-txt" rows="3" readonly hidden style="font-size:12px;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px"></textarea>
  <div id="b-conf"></div></div>
 <div class="note small"><b>Seguridad.</b> Calienta siempre. Dolor articular punzante = para ese ejercicio y usa la versión fácil.</div>
 ${st.htn?`<div class="card stack"><h3>Con tensión alta controlada</h3><ul class="plain">
  <li><b>El ejercicio es parte del tratamiento:</b> el cardio regular y la fuerza moderada bajan la tensión de 5 a 8 mmHg.</li>
  <li><b>Nunca aguantes la respiración</b> al hacer fuerza. Sopla en el esfuerzo. Aguantar el aire dispara la tensión en segundos.</li>
  <li><b>Esfuerzo máximo 7 de 10</b> y sin llegar al fallo. Por eso hay muchas repeticiones con peso moderado y ningún máximo.</li>
  <li><b>Plancha y ejercicios estáticos:</b> como mucho 30 s y respirando todo el rato.</li>
  <li><b>Vuelta a la calma obligatoria.</b> Algunos medicamentos bajan mucho la tensión después del ejercicio. No te pares de golpe y levántate del suelo despacio.</li>
  <li><b>Pulso:</b> si tomas betabloqueantes (bisoprolol, atenolol, nebivolol…), el pulso se queda bajo y no sirve de guía. Usa la prueba de hablar.</li>
  <li><b>Diuréticos:</b> bebe agua antes, durante y después. Ojo con el calor de mediodía.</li>
  <li><b>Para y consulta</b> si notas dolor u opresión en el pecho, mareo, dolor de cabeza fuerte, visión borrosa o palpitaciones raras.</li></ul></div>`:''}</div>`}

function vProg(){const ws=[...st.weights].sort((a,b)=>a.d<b.d?-1:1),first=ws[0]?.kg??105,cur=latestW(),h=st.height/100,bmi=cur/(h*h);
 let pace=null;if(ws.length>=2){const a=ws.find(x=>(parseD(ws.at(-1).d)-parseD(x.d))/864e5<=35)||ws[0],days=(parseD(ws.at(-1).d)-parseD(a.d))/864e5;if(days>=7)pace=(a.kg-ws.at(-1).kg)/days*7}
 const left=Math.max(0,cur-st.goal);let eta='';if(pace&&pace>0.05){const d=new Date();d.setDate(d.getDate()+left/pace*7);eta=d.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}
 else{const d=new Date();d.setDate(d.getDate()+left/0.6*7);eta='≈ '+d.toLocaleDateString('es-ES',{month:'long',year:'numeric'})+' a 0,6 kg/sem'}
 const mins=st.log.reduce((a,l)=>a+(l.min||0),0);
 return `<div class="stack"><h1>Progreso</h1>
 <div class="stats">
  <div class="stat"><div class="v tab-num">${cur.toFixed(1)}</div><div class="l">kg actuales</div></div>

  <div class="stat"><div class="v tab-num">${left.toFixed(1)}</div><div class="l">kg hasta ${st.goal}</div></div>
  <div class="stat"><div class="v tab-num">${bmi.toFixed(1)}</div><div class="l">IMC (sano: 18,5–24,9)</div></div></div>
 <div class="card stack"><div class="spread"><h3>Peso</h3><span class="small muted">${pace!=null?`${pace.toFixed(2).replace('.',',')} kg/sem`:'Pésate 1 vez por semana'}</span></div>${chart(ws)}
  <p class="small muted">Meta: ${eta}. Ritmo sano: 0,5–0,9 kg por semana. Pésate en ayunas, mismo día y hora.</p>
  <div class="row"><label class="f">Fecha<input type="date" id="w-d" value="${today()}"></label><label class="f">Peso (kg)<input type="number" step="0.1" inputmode="decimal" id="w-kg" placeholder="${cur.toFixed(1)}"></label></div>
  <button class="btn" id="w-add">Guardar peso</button>
  <table class="t">${ws.slice(-8).reverse().map(x=>`<tr><td>${parseD(x.d).toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</td><td class="tab-num"><b>${x.kg.toFixed(1)} kg</b></td><td style="text-align:right"><button class="x" data-wdel="${x.d}" aria-label="Borrar ${x.d}">×</button></td></tr>`).join('')}</table></div>
 <div class="card stack"><div class="spread"><h3>Sesiones hechas</h3><span class="small muted tab-num">${st.log.length} · ${Math.round(mins/60)} h</span></div>
  ${st.log.length?`<table class="t">${st.log.slice(-8).reverse().map(l=>`<tr><td>${parseD(l.d).toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</td><td>${esc(l.t)}</td><td class="tab-num">${l.min} min</td></tr>`).join('')}</table>`:'<p class="muted small">Aún no hay sesiones. Al terminar una, pulsa «Guardar sesión».</p>'}</div>
 ${st.htn?`<div class="card stack"><div class="spread"><h3>Tensión arterial</h3><span class="small muted">en casa, sentado, 5 min de reposo</span></div>
  <div class="row"><label class="f">Fecha<input type="date" id="bp-d" value="${today()}"></label><label class="f">Alta<input type="number" inputmode="numeric" id="bp-s" placeholder="128"></label><label class="f">Baja<input type="number" inputmode="numeric" id="bp-di" placeholder="82"></label></div>
  <button class="btn" id="bp-add">Guardar tensión</button>
  ${(st.bp||[]).length?`<table class="t">${[...st.bp].sort((a,b)=>a.d<b.d?1:-1).slice(0,8).map(b=>`<tr><td>${parseD(b.d).toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</td><td class="tab-num"><b style="color:${bpCol(b)}">${b.s}/${b.di}</b></td><td class="small muted">${bpTxt(b).split(':')[0]}</td><td style="text-align:right"><button class="x" data-bpdel="${b.d}" aria-label="Borrar">×</button></td></tr>`).join('')}</table>`:''}
  <p class="small muted">En casa, la referencia de buen control es por debajo de 135/85. Con cada kilo perdido suele bajar alrededor de 1 mmHg: enséñale estos datos a tu médico, puede que haya que ajustar la medicación.</p></div>`:''}
 <div class="card stack"><div class="spread"><h3>${st.name?'Seguimiento de '+esc(st.name):'Seguimiento mensual'}</h3><span class="small muted tab-num">mes ${monthNo()} · día ${dayNo()}</span></div>
  <table class="t"><tr><th>Mes</th><th>Sesiones</th><th>Horas</th><th>Peso</th><th>Cambio</th></tr>
  ${months().reverse().map(x=>`<tr><td><b>Mes ${x.m}</b><br><span class="small muted">desde ${x.a.toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</span></td><td class="tab-num">${x.ses}</td><td class="tab-num">${(x.min/60).toFixed(1).replace('.',',')}</td><td class="tab-num">${x.endKg!=null?x.endKg.toFixed(1):'–'}</td><td class="tab-num" style="color:${x.lost>0?'var(--good)':'var(--muted)'}">${x.lost!=null&&Math.abs(x.lost)>=0.05?(x.lost>0?'−':'+')+Math.abs(x.lost).toFixed(1)+' kg':'–'}</td></tr>`).join('')}</table>
  <p class="small muted">Los meses se cuentan desde el inicio del plan (${parseD(st.start).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}); puedes cambiar la fecha en Plan → Ajustes. Objetivo orientativo: 12 sesiones y unos 2–3 kg menos al mes.</p></div>
 <div class="note info small"><b>Mide también la cintura</b> cada 2 semanas a la altura del ombligo. Si baja la cintura y el peso se estanca, estás ganando músculo: vas bien.</div></div>`}
function chart(ws){const W0=340,H0=170,pl=34,pr=8,pt=10,pb=24;if(!ws.length)return '';
 const t0=parseD(ws[0].d).getTime(),days=Math.max(56,(parseD(ws.at(-1).d)-t0)/864e5+14);
 const lo=Math.min(st.goal-2,...ws.map(w=>w.kg))-1,hi=Math.max(...ws.map(w=>w.kg))+2;
 const X=d=>pl+(d/days)*(W0-pl-pr),Y=k=>pt+(hi-k)/(hi-lo)*(H0-pt-pb);
 const pts=ws.map(w=>[X((parseD(w.d)-t0)/864e5),Y(w.kg)]);
 const ideal=[[X(0),Y(ws[0].kg)],[X(days),Y(Math.max(st.goal,ws[0].kg-0.7*days/7))]];
 let g='';const step=(hi-lo)>20?5:2;for(let k=Math.ceil(lo/step)*step;k<=hi;k+=step)g+=`<line x1="${pl}" x2="${W0-pr}" y1="${Y(k)}" y2="${Y(k)}" stroke="var(--line)"/><text x="${pl-5}" y="${Y(k)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${k}</text>`;
 const goalY=Y(st.goal);
 return `<svg class="chart" viewBox="0 0 ${W0} ${H0}" role="img" aria-label="Gráfico de peso">${g}
 <line x1="${pl}" x2="${W0-pr}" y1="${goalY}" y2="${goalY}" stroke="var(--good)" stroke-dasharray="4 4"/><text x="${W0-pr}" y="${goalY-4}" text-anchor="end" font-size="11" fill="var(--good)">objetivo ${st.goal}</text>
 <line x1="${ideal[0][0]}" y1="${ideal[0][1]}" x2="${ideal[1][0]}" y2="${ideal[1][1]}" stroke="var(--muted)" stroke-dasharray="2 4"/>
 <polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
 ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:3}" fill="var(--accent)"/>`).join('')}
 <text x="${pl}" y="${H0-6}" font-size="11" fill="var(--muted)">${parseD(ws[0].d).toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</text><text x="${W0-pr}" y="${H0-6}" text-anchor="end" font-size="11" fill="var(--muted)">+${Math.round(days/7)} sem · línea gris = 0,7 kg/sem</text></svg>`}

 <div class="card stack"><h3>Un día de ejemplo</h3><table class="t">

 ${st.htn?`<div class="card stack"><h3>Para la tensión</h3><ul class="plain">
  <li><b>Sal: menos de 5 g al día</b> (una cucharadita rasa en total). El 70 % viene escondida en embutidos, quesos curados, pan, salsas, precocinados y snacks.</li>

 <div class="card stack"><h3>Reglas que más pesan</h3><ul class="plain">

 <p class="small muted">Orientación general basada en la fórmula Mifflin-St Jeor. Si tienes diabetes, hipertensión o tomas medicación, valida estas cifras con tu médico o un dietista.</p></div>`}

 view.querySelectorAll('[data-fw]').forEach(b=>b.onclick=()=>{exFilter.w=b.dataset.fw;render()});
 view.querySelectorAll('[data-fm]').forEach(b=>b.onclick=()=>{exFilter.m=b.dataset.fm;render()});
 const on=(id,ev,fn)=>{const el=document.getElementById(id);if(el)el[ev]=fn};
 on('back','onclick',()=>{openEx=null;render()});
 on('okSafety','onclick',()=>{st.seenSafety=true;save();render()});
 on('start','onclick',()=>startPlayer(workoutFor(selDay)));
 on('s-name','onchange',e=>{st.name=e.target.value.trim().slice(0,40);save()});
 on('n-save','onclick',()=>{const v=$('#n-in').value.trim().slice(0,40);if(!v){$('#n-in').focus();return}st.name=v;save();render()});
 on('s-start','onchange',e=>{if(e.target.value){st.start=e.target.value;save();render()}});
 on('s-phase','onchange',e=>{st.phase=+e.target.value;save();render()});
 on('s-h','onchange',e=>{st.height=+e.target.value||179;save()});
 on('s-age','onchange',e=>{st.age=+e.target.value||54;save()});
 on('s-goal','onchange',e=>{st.goal=+e.target.value||80;save()});
 on('s-sex','onchange',e=>{st.sex=e.target.value;save()});
 on('b-exp','onclick',async()=>{const t=JSON.stringify(st);try{await navigator.clipboard.writeText(t);$('#b-msg').textContent='Copia guardada en el portapapeles. Pégala en una nota o envíatela.'}catch(e){const a=$('#b-txt');a.hidden=false;a.value=t;a.select();$('#b-msg').textContent='Selecciona y copia este texto.'}});
 on('b-reset','onclick',()=>{$('#b-conf').innerHTML=`<div class="card stack"><p>Se borrarán el perfil, los pesos y las sesiones de este móvil. ¿Seguro?</p><div class="row"><button class="btn ghost" id="b-no">Cancelar</button><button class="btn" id="b-yes" style="background:var(--bad);color:#fff">Borrar todo</button></div></div>`;$('#b-no').onclick=()=>$('#b-conf').innerHTML='';$('#b-yes').onclick=()=>{try{localStorage.removeItem(LSK)}catch(e){}st=structuredClone(DEF);tab='hoy';render();scrollTo(0,0)}});
 on('s-htn','onchange',e=>{st.htn=e.target.checked;save();render()});
 view.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{tab=b.dataset.goto;render();scrollTo(0,0)});
 on('bp-add','onclick',()=>{const s1=+$('#bp-s').value,d1=+$('#bp-di').value,d=$('#bp-d').value||today();
  if(!(s1>70&&s1<260)){$('#bp-s').focus();return}if(!(d1>40&&d1<160)){$('#bp-di').focus();return}
  st.bp=(st.bp||[]).filter(x=>x.d!==d).concat({d,s:s1,di:d1});save();render()});
 view.querySelectorAll('[data-bpdel]').forEach(b=>b.onclick=()=>{st.bp=st.bp.filter(x=>x.d!==b.dataset.bpdel);save();render()});
 on('w-add','onclick',()=>{const kg=parseFloat(String($('#w-kg').value).replace(',','.')),d=$('#w-d').value||today();
  if(!(kg>40&&kg<250)){$('#w-kg').focus();return}st.weights=st.weights.filter(x=>x.d!==d).concat({d,kg});save();render()});
 view.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{if(st.weights.length<=1)return;st.weights=st.weights.filter(x=>x.d!==b.dataset.wdel);save();render()});
}

/* ============ REPRODUCTOR DE SESIÓN ============ */
let P=null,ac=null,wake=null,tick=null;
function beep(f=880,d=.15){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function buildSteps(w){const pi=phaseIdx(),steps=[];
 if(st.htn)steps.push({type:'list',title:'Antes de empezar',sec:0,list:PRECHECK});
 if(!w.noWarm)steps.push({type:'list',title:'Calentamiento',sec:420,list:WARM[st.mode]});
 if(w.cardioFirst&&w.cardio)steps.push({type:'time',ex:w.cardio.ex,sec:cmin(w,pi)*60,label:cmin(w,pi)+' min en zona 2'});
 if(w.circuit){const n=rounds(w,pi);for(let r=1;r<=n;r++)w.items.forEach((it0,i)=>{const it=adj(it0,pi),last=i===w.items.length-1;
   steps.push({type:EX[it.ex].unit==='s'?'time':'reps',ex:it.ex,sec:EX[it.ex].unit==='s'?it.reps:0,label:`Vuelta ${r} de ${n} · ${dose(it)}${EX[it.ex].unit==='s'?'':' repeticiones'}`,rest:last&&r<n?w.circuit.rest:(last?0:10)})})}
 else w.items.forEach(it0=>{const it=adj(it0,pi);for(let s=1;s<=it.sets;s++)steps.push({type:EX[it.ex].unit==='s'?'time':'reps',ex:it.ex,sec:EX[it.ex].unit==='s'?it.reps:0,label:`Serie ${s} de ${it.sets} · ${dose(it)}${EX[it.ex].unit==='s'?'':' repeticiones'}`,rest:it.rest})});
 if(w.cardio&&!w.cardioFirst)steps.push({type:'time',ex:w.cardio.ex,sec:cmin(w,pi)*60,label:cmin(w,pi)+' min en zona 2'});
 steps.push({type:'list',title:'Vuelta a la calma',sec:300,list:w.items.length?COOL:COOL.slice(0,2)});
 return steps}
async function startPlayer(w){if(!w)return;P={w,steps:buildSteps(w),i:0,t0:Date.now(),timer:null};beep(660,.05);
 try{wake=await navigator.wakeLock?.request('screen')}catch(e){}
 $('#player').hidden=false;document.body.style.overflow='hidden';clearInterval(tick);tick=setInterval(()=>{const el=$('#elapsed');if(el)el.textContent=fmt((Date.now()-P.t0)/1000)},1000);pRender()}
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function pRender(){const p=P,st0=p.steps[p.i],el=$('#player');clearInterval(p.timer);p.running=false;
 if(!st0){return pDone()}
 const pct=Math.round(p.i/p.steps.length*100),next=p.steps[p.i+1];
 let body='';
 if(st0.type==='list')body=st0.sec?`<h1>${st0.title}</h1><p class="muted">≈ ${Math.round(st0.sec/60)} min · a ritmo cómodo</p><div class="card"><ol class="steps">${st0.list.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div><div class="big" id="cd">${fmt(st0.sec)}</div><div class="row"><button class="btn ghost" id="p-go">Iniciar tiempo</button><button class="btn" id="p-done">Hecho</button></div>`
  :`<h1>${st0.title}</h1><p class="muted">Comprobación rápida por tu tensión arterial</p><div class="card"><ul class="plain">${st0.list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><button class="btn" id="p-done">Todo bien, empezar</button>`;
 else{const e=EX[st0.ex];body=`${figSVG(st0.ex)}<div><span class="eyebrow">${esc(e.m.slice(0,3).join(' · '))}</span><h1>${esc(e.n)}</h1></div><div class="dose-big">${esc(st0.label)}</div>
  <details class="card"><summary>Cómo se hace</summary><ol class="steps" style="margin-top:10px">${e.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p class="small muted" style="margin-top:8px"><b>Más fácil:</b> ${esc(e.easy)}</p></details>
  ${st0.type==='reps'?`<p class="small"><b>Respira:</b> sopla al hacer fuerza, coge aire al volver. Nunca aguantes el aire.</p>`:''}
  ${st0.type==='time'?`<div class="big" id="cd">${fmt(st0.sec)}</div><div class="row"><button class="btn ghost" id="p-go">Iniciar</button><button class="btn" id="p-done">Hecho</button></div>`:`<button class="btn" id="p-done">Serie hecha</button>`}`}
 el.innerHTML=`<div class="in"><div class="spread"><button class="btn sm ghost" id="p-exit">Salir</button><span class="tab-num muted"><span id="elapsed">${fmt((Date.now()-p.t0)/1000)}</span> · ${p.i+1}/${p.steps.length}</span><button class="btn sm ghost" id="p-prev" ${p.i?'':'disabled'}>Atrás</button></div><div class="bar"><i style="width:${pct}%"></i></div>${body}
  ${next?`<p class="small muted">Siguiente: ${esc(next.type==='list'?next.title:EX[next.ex].n)}</p>`:''}<div id="p-confirm"></div></div>`;
 $('#p-done').onclick=()=>{beep(990,.08);finishStep()};
 $('#p-exit').onclick=()=>{$('#p-confirm').innerHTML=`<div class="card stack"><p>¿Salir sin guardar la sesión?</p><div class="row"><button class="btn ghost" id="p-no">Seguir</button><button class="btn" id="p-yes">Salir</button></div></div>`;$('#p-no').onclick=()=>$('#p-confirm').innerHTML='';$('#p-yes').onclick=closePlayer};
 $('#p-prev').onclick=()=>{if(p.i){p.i--;pRender()}};
 const go=$('#p-go');if(go)go.onclick=()=>{if(p.running)return;p.running=true;go.disabled=true;let left=st0.sec;const end=Date.now()+left*1000;
  p.timer=setInterval(()=>{left=(end-Date.now())/1000;const c=$('#cd');if(c)c.textContent=fmt(left);if(left<=3.2&&left>0.2&&Math.abs(left-Math.round(left))<0.13)beep(660,.06);if(left<=0){clearInterval(p.timer);beep(990,.35);finishStep()}},120)};
 el.scrollTop=0}
function finishStep(){const s=P.steps[P.i];P.i++;if(s.rest&&P.i<P.steps.length)showRest(s.rest);else pRender()}
function showRest(sec){const r=$('#rest'),next=P.steps[P.i];let end=Date.now()+sec*1000;r.hidden=false;
 const draw=()=>{const left=(end-Date.now())/1000;r.innerHTML=`<span class="eyebrow" style="color:inherit;opacity:.7">Descanso</span><div class="big tab-num">${fmt(left)}</div><p>Siguiente: <b>${esc(next.type==='list'?next.title:EX[next.ex].n)}</b></p><p class="small" style="opacity:.75">${next.label?esc(next.label):''}</p><div class="row" style="width:100%;max-width:360px"><button class="btn ghost" id="r-plus">+15 s</button><button class="btn" id="r-skip">Seguir</button></div>`;
  $('#r-plus').onclick=()=>{end+=15000};$('#r-skip').onclick=endRest;return left};
 let lastBeep=99;const endRest=()=>{clearInterval(P.rt);r.hidden=true;pRender()};
 draw();P.rt=setInterval(()=>{const left=(end-Date.now())/1000;const b=r.querySelector('.big');if(b)b.textContent=fmt(left);
  const ls=Math.ceil(left);if(ls<=3&&ls>0&&ls!==lastBeep){lastBeep=ls;beep(660,.06)}if(left<=0){beep(990,.35);endRest()}},150)}
function pDone(){const min=Math.max(1,Math.round((Date.now()-P.t0)/60000));
 $('#player').innerHTML=`<div class="in" style="justify-content:center"><span class="eyebrow">Sesión completada</span><h1>${esc(P.w.t)}</h1><div class="big">${min} min</div><p class="muted">Cada sesión cuenta. Bebe agua y toma proteína en la próxima comida.</p><button class="btn" id="p-save">Guardar sesión</button><button class="btn ghost" id="p-close">Cerrar sin guardar</button></div>`;
 $('#p-save').onclick=()=>{st.log.push({d:today(),t:P.w.t,mode:st.mode,min});save();closePlayer()};$('#p-close').onclick=closePlayer}
function closePlayer(){clearInterval(P?.timer);clearInterval(P?.rt);clearInterval(tick);$('#rest').hidden=true;$('#player').hidden=true;$('#player').innerHTML='';document.body.style.overflow='';try{wake?.release()}catch(e){}wake=null;P=null;render()}
document.addEventListener('visibilitychange',async()=>{if(P&&document.visibilityState==='visible'){try{wake=await navigator.wakeLock?.request('screen')}catch(e){}}});

render();
</script>
